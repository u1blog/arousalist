<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse all experiences in the Kink Discovery Guide. Filter by tier, status, and category. Track your progress.">
  <title>Browse Experiences — Kink Discovery Guide</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="site-header">
    <nav class="site-nav">
      <a href="../" class="nav-logo">Kink Discovery Guide</a>
      <div class="nav-links">
        <a href="../experiences/" class="nav-link nav-link--active">Browse</a>
        <span class="header-progress"></span>
      </div>
    </nav>
  </header>

  <div class="browse-header">
    <div class="browse-header-inner">
      <h1 class="browse-title">Experiences</h1>
      <p class="browse-subtitle">Twelve structured exercises. Work through them at your own pace.</p>
      <div class="progress-bar-wrap">
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-tried-bar"></div>
        </div>
        <div class="progress-labels">
          <span class="progress-stat" id="progress-tried-count"><strong>0</strong> of 12 tried</span>
          <span class="progress-stat" id="progress-rated-count"><strong>0</strong> rated</span>
        </div>
      </div>
    </div>
  </div>

  <div class="filters-wrap">
    <div class="filters-inner">

      <div class="filter-group">
        <span class="filter-group-label">Tier</span>
        <button class="filter-btn is-active" data-filter-group="tier" data-filter-value="all">All</button>
        <button class="filter-btn" data-filter-group="tier" data-filter-value="solo-start">Solo start</button>
        <button class="filter-btn" data-filter-group="tier" data-filter-value="better-with-partner">Better with a partner</button>
        <button class="filter-btn" data-filter-group="tier" data-filter-value="partner-only">Partner only</button>
      </div>

      <div class="filter-divider" role="separator"></div>

      <div class="filter-group">
        <span class="filter-group-label">Status</span>
        <button class="filter-btn is-active" data-filter-group="status" data-filter-value="all">All</button>
        <button class="filter-btn" data-filter-group="status" data-filter-value="tried">Tried</button>
        <button class="filter-btn" data-filter-group="status" data-filter-value="not-tried">Not tried</button>
        <button class="filter-btn" data-filter-group="status" data-filter-value="rated">Rated</button>
      </div>

      <div class="filter-divider" role="separator"></div>

      <div class="filter-group">
        <span class="filter-group-label">Type</span>
        <button class="filter-btn is-active" data-filter-group="category" data-filter-value="all">All</button>
        <button class="filter-btn" data-filter-group="category" data-filter-value="sensation">Sensation-led</button>
        <button class="filter-btn" data-filter-group="category" data-filter-value="dynamic">Dynamic-led</button>
      </div>

    </div>
  </div>

  <main class="browse-main">
    <div class="browse-main-inner">
      <div class="experience-grid" id="experience-grid">
        <!-- Cards rendered by JS -->
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-note">Your ratings, notes, and progress are stored only in your browser — private and local.</p>
      <div class="reset-area">
        <button id="reset-btn" class="btn-reset">Clear all data</button>
        <div id="reset-confirm" hidden class="reset-confirm">
          <span>Are you sure? This can't be undone.</span>
          <button id="reset-cancel" class="btn-cancel-reset">Cancel</button>
          <button id="reset-confirm-btn" class="btn-confirm-reset">Yes, clear it</button>
        </div>
      </div>
    </div>
  </footer>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>

</body>
</html>
